<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novelist - Sign In</title>

    <link href="./src/output.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="font-['Montserrat'] text-white bg-[#1a1a1c]">
    <div
      class="relative w-full min-h-screen bg-cover bg-center bg-no-repeat flex flex-col justify-center px-8 md:px-20 lg:px-32 bg-[url('../asset/images/bgLogin.jpg')]"
    >
      <div class="w-full max-w-md">
        <div class="flex flex-col mb-10">
          <p
            class="text-[#a855f7] font-bold text-xl tracking-widest uppercase mb-2"
          >
            Novelist
          </p>
          <h1 class="text-white font-extrabold text-4xl mb-1">Hello!</h1>
          <h2 class="text-white font-bold text-3xl tracking-wide">
            Welcome Back, <span class="text-[#a855f7]">Reader</span>
          </h2>
        </div>

        <form>
          <div class="space-y-5">
            <div>
              <label class="block font-bold text-sm mb-2">Email</label>
              <input
                type="email"
                placeholder="Enter your email"
                class="w-full bg-[#1c1c1e]/80 border border-neutral-600 rounded-lg px-4 py-3 text-sm focus:border-[#a855f7] outline-none transition-all"
              />
            </div>

            <div>
              <label class="block font-bold text-sm mb-2">Password</label>
              <input
                type="password"
                placeholder="Enter your password"
                class="w-full bg-[#1c1c1e]/80 border border-neutral-600 rounded-lg px-4 py-3 text-sm focus:border-[#a855f7] outline-none transition-all"
              />
            </div>
          </div>

          <div class="mt-3 mb-8">
            <a
              href="./forgotpw-1.html"
              class="text-blue-500 text-sm font-semibold hover:underline"
              >Forgot Password?</a
            >
          </div>

          <button
            type="submit"
            class="w-full py-3.5 bg-[#8b5cf6] rounded-lg text-white font-bold hover:bg-[#7c3aed] transition-all shadow-lg"
          >
            <a href="./homePage.html"a>Login</a>
          </button>
        </form>

        <div class="flex items-center my-8">
          <div class="flex-grow border-t border-neutral-700"></div>
          <span class="px-4 text-sm font-bold text-neutral-400">Or</span>
          <div class="flex-grow border-t border-neutral-700"></div>
        </div>

        <div class="flex gap-4 mb-8">
          <button
            class="flex-1 bg-[#1c1c1e] border border-neutral-600 rounded-lg py-2.5 flex justify-center items-center hover:bg-neutral-800 transition-all"
          >
            <img
              src="../asset/images/twitter.png"
              alt="Twitter"
              class="h-5 w-auto object-contain"
            />
          </button>

          <button
            class="flex-1 bg-[#1c1c1e] border border-neutral-600 rounded-lg py-2.5 flex justify-center items-center hover:bg-neutral-800 transition-all"
          >
            <img
              src="../asset/images/google.png"
              alt="Google"
              class="h-5 w-auto object-contain"
            />
          </button>

          <button
            class="flex-1 bg-[#1c1c1e] border border-neutral-600 rounded-lg py-2.5 flex justify-center items-center hover:bg-neutral-800 transition-all"
          >
            <img
              src="../asset/images/apple-logo.png"
              alt="Apple"
              class="h-5 w-auto object-contain"
            />
          </button>
        </div>

        <p class="text-center text-sm font-bold">
          Don't have an account yet?
          <a href="./sign-up.html" class="text-blue-500 hover:underline">Register</a>
        </p>
      </div>
    </div>
  </body>
</html>
