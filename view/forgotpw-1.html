<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novelist Website</title>

    <link href="./output.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-['Montserrat'] text-white bg-[#1a1a1c]">
      <div class="relative w-full min-h-screen bg-cover bg-top bg-no-repeat flex flex-col bg-[url('../asset/images/bgLogin.jpg')]">
      
        <div class="w-full max-w-md ml-20">
        <div class="flex flex-col mt-26 gap-4">
          <p
            class="text-[#a855f7] font-bold text-xl tracking-widest uppercase mb-2"
          >
            Novelist
          </p>
          <h1 class="text-white font-bold text-3xl">Forgot your account?</h1>
          <h2 class="text-white font-bold text-3xl tracking-wide">
            Don't Worry, <span class="text-[#a855f7]">Reader</span>
          </h2>
        </div>

               <div class="mt-16">
              <label class="block font-bold text-sm mb-2">Email</label>
              <input
                type="email"
                placeholder="Enter your email"
                class="w-full bg-[#1c1c1e]/80 border border-neutral-600 rounded-lg px-4 py-3 text-sm focus:border-[#a855f7] outline-none transition-all"
              />
            </div>

            <button
            type="submit"
            class="w-full py-3.5 mt-10 bg-[#8b5cf6] rounded-lg text-white font-semibold hover:bg-[#7c3aed] transition-all shadow-lg"
          >
            <a href="./forgotpw-2.html">Reset Password</a>
          </button>
       
          <p class="font-semibold w-full py-3.5 mt-6 text-center"><a href="sign-in.html">Back To Login Page</a></p>

</div>
  </body>
</html>
