<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novelist - Sign In</title>

    <link href="./output.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="font-['Montserrat']">
    <div
      class="relative w-full min-h-screen bg-cover bg-top bg-no-repeat flex flex-col bg-[url('../asset/images/bgLogin.jpg')]"
    >
      <div class="ml-20 mt-8 gap-4 flex flex-col">
        <p class="text-purple-500 font-bold text-2xl pb-2">Novelist</p>
        <p class="text-white font-bold text-3xl">Hello!</p>
        <p class="text-white font-bold text-3xl">
          Welcome Back,
          <span class="text-purple-500 font-bold text-3xl">reader</span>
        </p>
      </div>

      <!-- Input -->
      <div class="ml-20 mt-8">
        <div class="pb-6">
          <p class="text-white font-bold text-sm pb-4">Email</p>
          <input
            type="email"
            placeholder="Enter your email"
            class="bg-black w-150 border border-neutral-300 rounded-lg placeholder-neutral-300 h-13"
          />
        </div>

        <div class="pb-6">
          <p class="text-white font-bold text-sm pb-4">Password</p>
          <input
            type="password"
            placeholder="Enter your password"
            class="bg-black w-150 border border-neutral-300 rounded-lg placeholder-neutral-300 h-13"
          />
        </div>

        <!-- Forgot Password -->
        <a
          href="#"
          class="text-purple-500 text-sm font-semibold mb-6 hover:text-purple-400"
        >
          Forgot Password?
        </a>
      </div>

      <!-- Button -->
      <div class="ml-20 mt-2">
        <a
          href="./homepage.html"
          class="flex justify-center items-center w-150 h-13 bg-[#7B3FF2] rounded-lg text-white font-bold text-base hover:bg-purple-600 transition-colors"
        >
          Login
        </a>
      </div>

      <div class=" ml-40 mt-2">
        <p class="text-white font-semibold">Or</p>
      </div>

      <!-- Kanan: Kosong (background icon tampil dari bgLogin.jpg) -->
      <div class="flex-1"></div>
    </div>
  </body>
</html>
