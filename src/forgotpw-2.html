<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novelist Website</title>

    <link href="./output.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-['Montserrat'] text-white bg-[#1a1a1c]">
    <div
      class="relative w-full min-h-screen bg-cover bg-top bg-no-repeat flex flex-col bg-[url('../asset/images/bgLogin.jpg')]"
    >
      <div class="w-full max-w-md ml-20">
        <div class="flex flex-col mt-26 gap-4">
          <p
            class="text-[#a855f7] font-bold text-xl tracking-widest uppercase mb-2"
          >
            Novelist
          </p>
          <h1 class="text-white font-bold text-3xl tracking-wide mt-4">Verify your code</h1>
        </div>

        <p class="text-gray-300 text-sm mb-4 mt-14 font-medium">***em@gmail.com</p>

        <div class="flex gap-3 mb-2" id="otp-inputs">
            <input type="number" maxlength="1" class="w-[50px] h-[50px] rounded-lg bg-white text-black text-center text-xl font-bold focus:outline-none focus:ring-4 focus:ring-[#a855f7]/50 transition-all">
            <input type="number" maxlength="1" class="w-[50px] h-[50px] rounded-lg bg-white text-black text-center text-xl font-bold focus:outline-none focus:ring-4 focus:ring-[#a855f7]/50 transition-all">
            <input type="number" maxlength="1" class="w-[50px] h-[50px] rounded-lg bg-white text-black text-center text-xl font-bold focus:outline-none focus:ring-4 focus:ring-[#a855f7]/50 transition-all">
            <input type="number" maxlength="1" class="w-[50px] h-[50px] rounded-lg bg-white text-black text-center text-xl font-bold focus:outline-none focus:ring-4 focus:ring-[#a855f7]/50 transition-all">
            <input type="number" maxlength="1" class="w-[50px] h-[50px] rounded-lg bg-white text-black text-center text-xl font-bold focus:outline-none focus:ring-4 focus:ring-[#a855f7]/50 transition-all">
        </div>
        <div class="flex items-center gap-2 mb-8 text-sm font-bold">
            <span id="timer" class="text-white">05:00</span>
            <button id="resend-btn" class="text-[#3b82f6] hover:text-blue-400 transition-colors disabled:text-gray-500 disabled:cursor-not-allowed">Resend Code</button>
        </div>

           <button
            type="submit"
            class="w-full py-3.5 mt-10 bg-[#8b5cf6] rounded-lg text-white font-semibold hover:bg-[#7c3aed] transition-all shadow-lg"
          >
            <a href="./forgotpw-3.html">Reset Password</a>
          </button>


      </div>
    </div>

<script>
        // --- LOGIKA UNTUK INPUT OTP ---
        const inputs = document.querySelectorAll('#otp-inputs input');

        inputs.forEach((input, index) => {
            // Membatasi input hanya 1 angka
            input.addEventListener('input', function(e) {
                if (this.value.length > 1) {
                    this.value = this.value.slice(0, 1);
                }
                // Pindah ke input berikutnya jika sudah diisi
                if (this.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Pindah ke input sebelumnya jika menekan backspace pada input yang kosong
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Fokus pada input pertama saat halaman dimuat
        window.onload = () => inputs[0].focus();


        // --- LOGIKA UNTUK TIMER ---
        const timerDisplay = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');
        let timeLeft = 300; // 5 menit dalam detik (5 * 60)
        let timerInterval;

        function startTimer() {
            resendBtn.disabled = true; // Nonaktifkan tombol resend saat timer berjalan
            
            timerInterval = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;

                // Format tampilan agar selalu 2 digit (misal: 05:09)
                const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                timerDisplay.textContent = formattedTime;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = "00:00";
                    resendBtn.disabled = false; // Aktifkan tombol resend jika waktu habis
                } else {
                    timeLeft--;
                }
            }, 1000); // Update setiap 1000ms (1 detik)
        }

        // Mulai timer pertama kali
        startTimer();

        // Logika ketika tombol Resend diklik
        resendBtn.addEventListener('click', () => {
            if(!resendBtn.disabled) {
                timeLeft = 300; // Reset ke 5 menit
                startTimer();
                
                // Kosongkan inputan
                inputs.forEach(input => input.value = '');
                inputs[0].focus();
                
                // Disini kamu bisa menambahkan logika untuk memanggil API pengiriman ulang kode
                console.log("Kode OTP dikirim ulang!");
            }
        });
    </script>

  </body>
</html>
