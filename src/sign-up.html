<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novelist - Sign Up</title>

    <link href="./output.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="font-['Montserrat'] text-white bg-[#1a1a1c]">
    <div
      class="relative w-full min-h-screen bg-cover bg-center bg-no-repeat flex flex-col justify-center px-8 md:px-20 lg:px-32 bg-[url('../asset/images/bgLogin.jpg')]"
    >
      <div class="w-full max-w-md">
        
        <div class="flex flex-col mb-10">
          <p class="text-[#a855f7] font-bold text-xl tracking-widest uppercase mb-2">Novelist</p>
          <h1 class="text-white font-extrabold text-4xl mb-1">Hello!</h1>
          <h2 class="text-white font-bold text-3xl tracking-wide">
            Welcome, <span class="text-[#a855f7]">Reader</span>
          </h2>
        </div>

        <form>
          <div class="space-y-5">
            <div>
              <label class="block font-bold text-sm mb-2" for="userName">Username</label>
              <input
                type="text"
                id="userName"
                placeholder="Create your username"
                class="w-full bg-[#1c1c1e]/80 border border-neutral-600 rounded-lg px-4 py-3 text-sm focus:border-[#a855f7] outline-none transition-all placeholder-neutral-400"
              />
            </div>

            <div>
              <label class="block font-bold text-sm mb-2" for="maIl">Email</label>
              <input
                type="email"
                id="maIl"
                placeholder="Enter your email"
                class="w-full bg-[#1c1c1e]/80 border border-neutral-600 rounded-lg px-4 py-3 text-sm focus:border-[#a855f7] outline-none transition-all placeholder-neutral-400"
              />
            </div>

            <div>
              <label class="block font-bold text-sm mb-2" for="passWord">Password</label>
              <input
                type="password"
                id="passWord"
                placeholder="Create a password"
                class="w-full bg-[#1c1c1e]/80 border border-neutral-600 rounded-lg px-4 py-3 text-sm focus:border-[#a855f7] outline-none transition-all placeholder-neutral-400"
              />
            </div>
          </div>

          <button
            type="submit"
            class="w-full py-3.5 mt-10 bg-[#8b5cf6] rounded-lg text-white font-bold hover:bg-[#7c3aed] transition-all shadow-lg"
          >
            <a href="./homepage.html">Sign Up</a>
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-white font-semibold text-sm">
            Already have an account? 
            <a href="./login.html" class="text-blue-500 hover:text-blue-400 hover:underline ml-1 transition-all">Login</a>
          </p>
        </div>

      </div>
    </div>
  </body>
</html>
