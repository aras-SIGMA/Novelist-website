<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novelist Website</title>

    <link href="./output.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="font-['Montserrat']">
    <div
      class="relative w-full min-h-screen bg-cover bg-top bg-no-repeat flex flex-col bg-[url('../asset/images/bgLogin.jpg')]"
    >
      <div class="ml-20 mt-8 gap-4 flex flex-col">
        <p class="text-purple-500 font-bold text-2xl pb-2">Novelist</p>
        <p class="text-white font-bold text-3xl">Hello!</p>
        <p class="text-white font-bold text-3xl">
          Welcome,
          <span class="text-purple-500 font-bold text-3xl">reader</span>
        </p>
      </div>

      <!--input -->
      <div class="ml-20 mt-8">
        <div class="pb-6">
          <p class="text-white font-bold text-sm pb-4">Username</p>
          <input type="text" id="userName" placeholder="Create your username" class=" bg-black w-150 border border-neutral-300 rounded-lg placeholder-neutral-300 h-13"/>
        </div>
        <div class="pb-6">
          <p class="text-white font-bold text-sm pb-4">Email</p>
          <input type="text" id="maIl" placeholder="Enter your email" class=" bg-black w-150 border border-neutral-300 rounded-lg placeholder-neutral-300 h-13"/>
        </div>
        <div class="pb-6">
          <p class="text-white font-bold text-sm pb-4">Password</p>
          <input type="text" id="passWord" placeholder="Enter your password" class=" bg-black w-150 border border-neutral-300 rounded-lg placeholder-neutral-300 h-13"/>
        </div>
      </div>

      <!-- button -->

<div class="ml-20 mt-2">
        <a href="./homepage.html" class="flex justify-center items-center w-150 h-13 bg-[#7B3FF2] rounded-lg text-white font-bold text-base hover:bg-purple-600 transition-colors">
          Sign Up
        </a>
        
        <div class="w-150 mt-8 text-center">
          <p class="text-white font-semibold text-sm">
            Already have an account? 
            <a href="#" class="text-blue-500 hover:text-blue-400 ml-1">Login</a>
          </p>
        </div>
      </div>

    </div>
  </body>
</html>
